services:
  # Backend Service
  - type: web
    name: vedaai-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: https://vedaai-frontend.onrender.com,http://localhost:3000
      - key: DEMO_MODE
        value: true
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o
      - key: AI_PROVIDER
        value: openai

  # Frontend Service
  - type: web
    name: vedaai-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vedaai-backend.onrender.com
